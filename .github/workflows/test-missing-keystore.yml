name: Android preflight tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expected-failures:
    name: Reject missing ${{ matrix.missing }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        missing:
          - RELEASE_KEYSTORE_BASE64
          - RELEASE_KEY_ALIAS
          - RELEASE_STORE_PASSWORD
          - RELEASE_KEY_PASSWORD
          - APPLICATION_ID
          - VERSION_CODE
          - VERSION_NAME
    steps:
      - uses: actions/checkout@v4

      - name: Run preflight and require failure
        env:
          RELEASE_KEYSTORE_BASE64: ${{ matrix.missing == 'RELEASE_KEYSTORE_BASE64' && '' || 'dGVzdA==' }}
          RELEASE_KEY_ALIAS: ${{ matrix.missing == 'RELEASE_KEY_ALIAS' && '' || 'upload' }}
          RELEASE_STORE_PASSWORD: ${{ matrix.missing == 'RELEASE_STORE_PASSWORD' && '' || 'store-password' }}
          RELEASE_KEY_PASSWORD: ${{ matrix.missing == 'RELEASE_KEY_PASSWORD' && '' || 'key-password' }}
          APPLICATION_ID: ${{ matrix.missing == 'APPLICATION_ID' && '' || 'com.example.kiwehp' }}
          VERSION_CODE: ${{ matrix.missing == 'VERSION_CODE' && '' || '1' }}
          VERSION_NAME: ${{ matrix.missing == 'VERSION_NAME' && '' || '1.0' }}
        run: |
          set +e
          output="$(bash .github/scripts/preflight.sh 2>&1)"
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "Preflight unexpectedly passed with ${{ matrix.missing }} missing" >&2
            exit 1
          fi
          grep -Fq "Missing required production value: ${{ matrix.missing }}" <<<"$output"

  valid-configuration:
    name: Accept valid configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run preflight
        env:
          RELEASE_KEYSTORE_BASE64: dGVzdA==
          RELEASE_KEY_ALIAS: upload
          RELEASE_STORE_PASSWORD: store-password
          RELEASE_KEY_PASSWORD: key-password
          APPLICATION_ID: com.example.kiwehp
          VERSION_CODE: 1
          VERSION_NAME: 1.0
        run: bash .github/scripts/preflight.sh
